name: 论文绘图案例库 · 自动更新与发布

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      collect:
        description: 本次是否调用接口采集（日更新增优先；未勾选则只发布）
        type: boolean
        default: true
      mode:
        description: auto 和 daily 优先新增；backfill 仅维护旧案例，不进行日更
        type: choice
        default: auto
        options:
          - auto
          - backfill
          - daily
  schedule:
    # Beijing 09:47, 15:47, 21:47. Later runs top up the same UTC-day target
    # and share its durable success quota/budgets; they do not each add five.
    # GitHub may delay scheduled runs; reaching the target makes reruns no-op.
    - cron: '47 1 * * *'
    - cron: '47 7 * * *'
    - cron: '47 13 * * *'

concurrency:
  group: paper-plot-library-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安装本站依赖（不安装作者仓库依赖）
        run: python -m pip install .
      - name: 离线校验实际数据（合并冲突与损坏数据立即停止）
        run: python -m paper_plot_library validate-data
      - name: 离线回归测试
        run: python -m unittest discover -s tests --buffer
      - name: 日更新增优先（同日目标成功5篇，后续触发仅补足；旧库维护须显式选择）
        id: collect
        continue-on-error: true
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        env:
          UPDATE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'daily' }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          EASYSCHOLAR_SECRET_KEY: ${{ secrets.EASYSCHOLAR_SECRET_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/cloud_collect.py
      - name: 最终保存（采集异常也保留已完成批次）
        if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)) }}
        run: |
          git add -- data/catalog.json data/ledger.json data/updates.json
          if [ -d data/assets ]; then git add -- data/assets; fi
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: final plotting-library checkpoint [skip ci]'
          fi
          git push origin HEAD:main
      - name: 提示需要处理的采集错误
        if: ${{ !cancelled() && steps.collect.outcome == 'failure' }}
        run: echo '::warning::采集入口异常；已尝试保存已有检查点，请查看采集与保存步骤。已保存的批次不会被撤销。'
      - name: 白名单导出公开网站（只上传发布产物）
        id: export
        run: |
          export_path=$(python -m paper_plot_library export)
          echo "path=$export_path" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.export.outputs.path }}
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
