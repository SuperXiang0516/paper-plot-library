name: 论文绘图案例库 · 自动更新与发布

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      collect:
        description: 本次是否抓取并整理新案例
        type: boolean
        default: true
  schedule:
    # UTC 01:47 daily (Beijing 09:47). Schedule may be delayed by GitHub.
    - cron: '47 1 * * *'

concurrency:
  group: paper-plot-library-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安装本站依赖（不安装作者仓库依赖）
        run: python -m pip install .
      - name: 离线回归测试
        run: python -m unittest discover -s tests
      - name: 自动采集（每日最多5篇；接口缺失可降级）
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        env:
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          EASYSCHOLAR_SECRET_KEY: ${{ secrets.EASYSCHOLAR_SECRET_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python -m paper_plot_library update
      - name: 仅提交公开目录、账本和许可允许的图像
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: |
          git add -- data/catalog.json data/ledger.json data/updates.json
          if [ -d data/assets ]; then git add -- data/assets; fi
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: update plotting-paper library'
            git push origin HEAD:main
          fi
      - name: 白名单导出公开网站（只上传发布产物）
        id: export
        run: |
          export_path=$(python -m paper_plot_library export)
          echo "path=$export_path" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.export.outputs.path }}
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
